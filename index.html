<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Context单词">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/brain.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007aff">

    <title>FSRS Context Pro</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #000000;
            --subtext: #8e8e93;
            --accent: #007aff;
            --danger: #ff3b30;
            --warning: #ffcc00;
            --success: #34c759;
            --radius: 20px;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            padding-top: env(safe-area-inset-top, 20px);
            padding-bottom: 100px; /* Space for bottom buttons */
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin: 20px 0;
            letter-spacing: -0.5px;
        }

        /* Card Display */
        .card-display {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 0.2s;
        }
        
        .word-text {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text);
            letter-spacing: -1px;
        }

        .pronounce-hint {
            color: var(--accent);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* Context Area */
        .context-area {
            background: #f2f2f7;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            text-align: left;
            font-size: 17px;
            line-height: 1.5;
            color: #333;
        }
        
        .context-sentence b {
            color: var(--accent);
            font-weight: 600;
        }

        /* Buttons */
        button {
            border: none;
            font-family: inherit;
            cursor: pointer;
        }

        .action-btn {
            padding: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            transition: opacity 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        .action-btn:active { opacity: 0.7; transform: scale(0.98); }

        .full-width-btn {
            width: 100%;
            background: var(--text);
            color: white;
            padding: 18px;
            font-size: 18px;
            border-radius: 16px;
            margin-top: 10px;
        }

        .actions-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #ratingButtons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
        }

        .btn-again { background: var(--danger); }
        .btn-hard { background: #ff9f0a; }
        .btn-good { background: var(--success); }
        .btn-easy { background: #30b0c7; }

        /* Inputs */
        input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: none;
            background: #e5e5ea;
            font-size: 17px;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        
        input:focus, textarea:focus {
            background: #fff;
            box-shadow: 0 0 0 2px var(--accent);
            outline: none;
        }

        /* Floating Portals */
        .portal-btn {
            position: fixed;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: transform 0.2s;
        }
        
        .portal-btn:active { transform: scale(0.9); }

        .listening-btn {
            bottom: 30px;
            right: 30px;
            background: rgba(28, 28, 30, 0.9);
            border: 2px solid #00ff41;
        }
        
        .pdf-btn {
            bottom: 30px;
            left: 30px;
            background: rgba(0, 122, 255, 0.9);
            border: 2px solid white;
        }

        /* Utilities */
        .hidden { display: none !important; }
        .blur { filter: blur(5px); user-select: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>FSRS Context</h1>

    <!-- Review Section -->
    <div id="reviewContainer">
        <div class="card-display">
            <div id="wordDisplay" class="word-text" onclick="speakCurrent()">Loading...</div>
            <div class="pronounce-hint">Tap to listen 🔊</div>

            <div id="contextArea" class="context-area hidden">
                <div id="contextSentence" class="context-sentence"></div>
            </div>
            
            <div id="definitionArea" class="context-area hidden" style="background:#fff3cd; border-left:4px solid #ffcc00;">
                <div id="definitionText"></div>
            </div>
        </div>

        <div class="actions-wrapper">
            <button id="showAnswerBtn" class="full-width-btn" onclick="revealAnswer()">Show Answer</button>

            <div id="ratingButtons" class="hidden">
                <button class="action-btn btn-again" onclick="rate(1)">Again<br><small>1m</small></button>
                <button class="action-btn btn-hard" onclick="rate(2)">Hard<br><small>2d</small></button>
                <button class="action-btn btn-good" onclick="rate(3)">Good<br><small>3d</small></button>
                <button class="action-btn btn-easy" onclick="rate(4)">Easy<br><small>4d</small></button>
            </div>
        </div>
    </div>

    <!-- Input Section (Collapsed by default in review mode) -->
    <div id="inputSection" style="margin-top:40px; text-align:center;">
        <button onclick="document.getElementById('addModal').style.display='flex'" style="background:none; color:var(--accent); font-size:16px;">+ Add New Word</button>
    </div>
    
    <div style="margin-top:20px; color:#999; font-size:12px; text-align:center;">
        Cards: <span id="cardCount">0</span> | DeepSeek AI Enabled
    </div>
</div>

<!-- Portals -->
<a href="listening.html" class="portal-btn listening-btn" title="Listening Mode">🎧</a>
<a href="pdf.html" class="portal-btn pdf-btn" title="PDF Reader">📄</a>

<!-- Add Modal -->
<div id="addModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:flex-end;">
    <div style="background:var(--bg); width:100%; max-width:600px; padding:20px; border-radius:20px 20px 0 0; box-shadow:0 -5px 20px rgba(0,0,0,0.1);">
        <h3 style="margin-top:0;">Add New Word</h3>
        <input type="text" id="newWord" placeholder="Enter word...">
        <textarea id="newContext" placeholder="Context sentence (optional)..." rows="3"></textarea>
        <button class="full-width-btn" onclick="addNewCard()" style="background:var(--accent);">Save Card</button>
        <button onclick="document.getElementById('addModal').style.display='none'" style="width:100%; padding:15px; background:none; color:var(--danger); margin-top:5px;">Cancel</button>
    </div>
</div>

<script>
    // --- Configuration ---
    const AI_CONFIG = {
        apiKey: "sk-f3ff7365a06f4fe1ae7609ebbd2238ac",
        baseUrl: "https://api.deepseek.com/chat/completions",
        model: "deepseek-chat"
    };

    // --- State ---
    let deck = JSON.parse(localStorage.getItem('fsrs_deck_v3') || '[]');
    let currentCard = null;
    let audioUnlocked = false;

    // --- Core: iOS Audio Unlock ---
    function unlockAudio() {
        if (audioUnlocked) return;
        
        // 1. Resume AudioContext (if using Web Audio API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            const ctx = new AudioContext();
            ctx.resume();
            const buffer = ctx.createBuffer(1, 1, 22050);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
        }

        // 2. Prime SpeechSynthesis
        const u = new SpeechSynthesisUtterance(" ");
        speechSynthesis.speak(u);

        audioUnlocked = true;
        document.removeEventListener('click', unlockAudio);
        document.removeEventListener('touchstart', unlockAudio);
    }
    
    document.addEventListener('click', unlockAudio);
    document.addEventListener('touchstart', unlockAudio);

    // --- FSRS Algorithm (Simplified) ---
    function getInterval(stability) {
        return Math.max(1, Math.round(stability * 9 * (1/0.9 - 1)));
    }

    // --- App Logic ---
    function init() {
        renderDeckStats();
        loadNextCard();
    }

    function loadNextCard() {
        const now = Date.now();
        const due = deck.filter(c => c.due <= now).sort((a,b) => a.due - b.due);
        
        if (due.length > 0) {
            currentCard = due[0];
            renderCard(currentCard);
            document.getElementById('reviewContainer').style.display = 'block';
        } else {
            document.getElementById('reviewContainer').innerHTML = 
                '<div style="text-align:center; padding:50px; color:#888;"><h3>🎉 All caught up!</h3><p>Come back later.</p></div>';
        }
    }

    function renderCard(card) {
        document.getElementById('wordDisplay').innerText = card.word;
        document.getElementById('contextSentence').innerHTML = card.sentence.replace(
            new RegExp(card.word, 'gi'), 
            `<b>${card.word}</b>`
        );
        document.getElementById('definitionText').innerText = card.definition || "";
        
        // Reset View
        document.getElementById('contextArea').classList.add('hidden');
        document.getElementById('definitionArea').classList.add('hidden');
        document.getElementById('ratingButtons').classList.add('hidden');
        document.getElementById('showAnswerBtn').classList.remove('hidden');
    }

    function revealAnswer() {
        document.getElementById('contextArea').classList.remove('hidden');
        if(currentCard.definition) document.getElementById('definitionArea').classList.remove('hidden');
        
        document.getElementById('showAnswerBtn').classList.add('hidden');
        document.getElementById('ratingButtons').classList.remove('hidden');
        
        // Auto-play audio on reveal if enabled
        speakCurrent();
    }

    function rate(grade) {
        // Simplified FSRS update
        const now = Date.now();
        let s = currentCard.stability || 0;
        let d = currentCard.difficulty || 5;
        
        if (grade === 1) {
            currentCard.due = now + 60000; // 1 min
            currentCard.stability = 0.5;
        } else {
            // Simple exponential growth for demo
            if (s === 0) s = 1;
            const nextS = s * (1 + (grade - 2) * 0.5); // 1->1, 3->1.5x, 4->2x
            currentCard.stability = nextS;
            currentCard.due = now + (getInterval(nextS) * 86400000);
        }
        
        saveDeck();
        loadNextCard();
    }

    function addNewCard() {
        const word = document.getElementById('newWord').value.trim();
        const sentence = document.getElementById('newContext').value.trim();
        if (!word) return;

        const newCard = {
            id: Date.now().toString(),
            word: word,
            sentence: sentence,
            definition: "",
            due: Date.now(),
            stability: 0,
            difficulty: 5,
            reps: 0
        };

        deck.push(newCard);
        saveDeck();
        
        // AI Fetch in background
        fetchAIContext(newCard);

        document.getElementById('newWord').value = '';
        document.getElementById('newContext').value = '';
        document.getElementById('addModal').style.display = 'none';
        init();
    }

    async function fetchAIContext(card) {
        if (!AI_CONFIG.apiKey) return;
        
        try {
            const prompt = `Generate a learning card for word "${card.word}". JSON format: {"sentence": "sentence with word", "definition": "short definition"}`;
            const res = await fetch(AI_CONFIG.baseUrl, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json", 
                    "Authorization": `Bearer ${AI_CONFIG.apiKey}` 
                },
                body: JSON.stringify({
                    model: AI_CONFIG.model,
                    messages: [{role: "user", content: prompt}],
                    response_format: { type: "json_object" }
                })
            });
            const data = await res.json();
            const content = JSON.parse(data.choices[0].message.content);
            
            // Update card
            const idx = deck.findIndex(c => c.id === card.id);
            if (idx !== -1) {
                deck[idx].sentence = content.sentence || deck[idx].sentence;
                deck[idx].definition = content.definition || deck[idx].definition;
                saveDeck();
                if (currentCard && currentCard.id === card.id) renderCard(deck[idx]);
            }
        } catch (e) { console.error(e); }
    }

    function speakCurrent() {
        if (!currentCard) return;
        const u = new SpeechSynthesisUtterance(currentCard.word);
        u.lang = 'en-US';
        speechSynthesis.speak(u);
    }

    function saveDeck() {
        localStorage.setItem('fsrs_deck_v3', JSON.stringify(deck));
        renderDeckStats();
    }

    function renderDeckStats() {
        document.getElementById('cardCount').innerText = deck.length;
    }

    // Start
    init();

</script>
</body>
</html>
