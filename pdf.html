    body {

    .react-pdf__Page {

      background-color: white;

    .react-pdf__Page__textContent {
      position: absolute;

      transform-origin: 0 0;

    }

    .react-pdf__Page__textContent span {

      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    ::selection {
      background: rgba(59, 130, 246, 0.3);
    }

    .react-pdf__Page__annotations {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

  <script>
    // 1. Global Debug Logger (Must be defined first and globally)
    window.log = function (msg, type = 'info') {
      console.log(msg);
      // Wait for DOM
      setTimeout(() => {
        const box = document.getElementById('debug-console');
        if (box) {
          const line = document.createElement('div');
          line.innerText = `[${type}] ${msg}`;
          line.style.color = type === 'error' ? 'red' : 'black';
          line.style.borderBottom = '1px solid #eee';
          box.appendChild(line);

          // Auto-show on error
          if (type === 'error') box.classList.add('active');
        }
      }, 100);
    };

    window.onerror = function (msg, url, lineNo, columnNo, error) {
      window.log(`${msg} at ${lineNo}:${columnNo}`, 'error');
      return false;
    };

    window.onunhandledrejection = function (event) {
      window.log(`Unhandled Rejection: ${event.reason}`, 'error');
    };
  </script>

  <script type="module">
    import { pdfjs } from 'react-pdf';

    try {
      // 2. Worker Configuration
      // 'react-pdf' v9/v10 works best with PDF.js 4.4.168 or 4.8.69.
      // v5.x is too new and often breaks ESM loading on CDNs.
      // We FORCE a stable version here to avoid "bleeding edge" incompatibility.
      const STABLE_VERSION = '4.8.69';

      window.log(`Configuring PDF Worker... Forcing Version: ${STABLE_VERSION}`);

      // Use cdnjs or unpkg. 'unpkg' is good. We point to the classic script or mjs.
      // For broad compatibility, we use the mjs build.
      pdfjs.GlobalWorkerOptions.workerSrc = `https://unpkg.com/pdfjs-dist@${STABLE_VERSION}/build/pdf.worker.min.mjs`;

      window.log(`Worker Src set to: ${pdfjs.GlobalWorkerOptions.workerSrc}`);

    } catch (e) {
      window.log(`Worker Config Failed: ${e.message}`, 'error');
    }
  </script>
  <style>
    /* Debug Console Styles */
    #debug-console {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 200px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 2px solid red;
      z-index: 10000;
      overflow-y: auto;
      font-size: 10px;
      font-family: monospace;
      padding: 10px;
      display: none;
      /* Hidden by default, toggled by error or triple tap */
      pointer-events: none;
      /* Let clicks pass through unless active */
    }

    #debug-console.active {
      display: block;
      pointer-events: auto;
    }

    /* Loading Spinner Styles */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007aff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Debug Console HTML -->
  <div id="debug-console"></div>

  <div id="loading-overlay" onclick="document.getElementById('debug-console').classList.toggle('active')">
    <div class="spinner"></div>
    <p style="margin-top: 20px; color: #666; font-family: sans-serif;">Loading PDF Reader...</p>
    <p style="margin-top: 10px; color: #999; font-size: 10px;">(Tap here to view Debug Log)</p>
    <div style="margin-top:20px; font-size:10px; color:#ccc">v2.1 Fix Patch</div>
  </div>
  <script>
    // Hide loading overlay when React loads (simple timeout fallback or event listener if possible)
    window.addEventListener('load', () => {
      // Give React a moment to render
      setTimeout(() => {
        const overlay = document.getElementById('loading-overlay');
        const root = document.getElementById('root');

        // Check if root has children (React rendered something)
        const isRendered = root && root.childElementCount > 0;

        if (isRendered && overlay) {
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 500);
        } else {
          // If still empty, log warning
          log("Root element is empty. React app likely failed to mount.", "error");
          // Show debug console automatically if it failed
          const consoleEl = document.getElementById('debug-console');
          if (consoleEl) consoleEl.classList.add('active');
        }
      }, 2500); // Wait 2.5s for slow mobile networks
    });
  </script>
  <div id="root"></div>

  <!-- 返回首页按钮 -->
  <a href="index.html" class="home-btn" title="返回单词学习">
    <span class="home-icon">🏠</span>
  </a>

  <!-- Service Worker 注册 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
