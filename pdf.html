<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>LinguistPDF - PDF阅读翻译</title>

  <!-- PWA 配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDF阅读">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/brain.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      overflow: hidden;
    }

    .react-pdf__Page {
      position: relative;
      background-color: white;
    }

    .react-pdf__Page__textContent {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .react-pdf__Page__textContent span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    ::selection {
      background: rgba(59, 130, 246, 0.3);
    }

    .react-pdf__Page__annotations {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 返回按钮样式 */
    .home-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #007aff, #005bb5);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .home-btn:active {
      transform: scale(0.95);
    }

    .home-icon {
      font-size: 24px;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-pdf": "https://esm.sh/react-pdf@^10.3.0"
  }
}
</script>
  <!-- <script type="module" crossorigin src="assets/index-C39uaRO3.js"></script> -->
  <script>
    // 1. Global Debug Logger (Must be defined first and globally)
    window.log = function (msg, type = 'info') {
      console.log(msg);
      // Wait for DOM
      setTimeout(() => {
        const box = document.getElementById('debug-console');
        if (box) {
          const line = document.createElement('div');
          line.innerText = `[${type}] ${msg}`;
          line.style.color = type === 'error' ? 'red' : 'black';
          line.style.borderBottom = '1px solid #eee';
          box.appendChild(line);

          // Auto-show on error
          if (type === 'error') box.classList.add('active');
        }
      }, 100);
    };

    window.onerror = function (msg, url, lineNo, columnNo, error) {
      window.log(`${msg} at ${lineNo}:${columnNo}`, 'error');
      return false;
    };

    window.onunhandledrejection = function (event) {
      window.log(`Unhandled Rejection: ${event.reason}`, 'error');
    };
  </script>

  <script type="module">
    import { pdfjs } from 'react-pdf';

    try {
      // 2. Worker Configuration
      // 'react-pdf' v9/v10 works best with PDF.js 4.4.168 or 4.8.69.
      // v5.x is too new and often breaks ESM loading on CDNs.
      // We FORCE a stable version here to avoid "bleeding edge" incompatibility.
      const STABLE_VERSION = '4.8.69';

      window.log(`Configuring PDF Worker... Forcing Version: ${STABLE_VERSION}`);

      // Use cdnjs or unpkg. 'unpkg' is good. We point to the classic script or mjs.
      // For broad compatibility, we use the mjs build.
      pdfjs.GlobalWorkerOptions.workerSrc = `https://unpkg.com/pdfjs-dist@${STABLE_VERSION}/build/pdf.worker.min.mjs`;

      window.log(`Worker Src set to: ${pdfjs.GlobalWorkerOptions.workerSrc}`);

    } catch (e) {
      window.log(`Worker Config Failed: ${e.message}`, 'error');
    }
  </script>
  <style>
    /* Debug Console Styles */
    #debug-console {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 200px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 2px solid red;
      z-index: 10000;
      overflow-y: auto;
      font-size: 10px;
      font-family: monospace;
      padding: 10px;
      display: none;
      /* Hidden by default, toggled by error or triple tap */
      pointer-events: none;
      /* Let clicks pass through unless active */
    }

    #debug-console.active {
      display: block;
      pointer-events: auto;
    }

    /* Loading Spinner Styles */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007aff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <!-- Debug Console HTML -->
  <div id="debug-console"></div>

  <div id="loading-overlay" onclick="document.getElementById('debug-console').classList.toggle('active')">
    <div class="spinner"></div>
    <p style="margin-top: 20px; color: #666; font-family: sans-serif;">Loading PDF Reader...</p>
    <p style="margin-top: 10px; color: #999; font-size: 10px;">(Tap here to view Debug Log)</p>
    <div style="margin-top:20px; font-size:10px; color:#ccc">v2.4 (Worker Auto-Match)</div>
  </div>
  <script type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { Document, Page, pdfjs } from 'react-pdf';

    // Ensure worker is set (redundant check but safe)
    if (!pdfjs.GlobalWorkerOptions.workerSrc) {
      try {
        // 动态匹配版本，防止 API 与 Worker 版本不一致报错
        const v = pdfjs.version || '5.4.296';
        console.log(`Setting worker to version: ${v}`);
        pdfjs.GlobalWorkerOptions.workerSrc = `https://unpkg.com/pdfjs-dist@${v}/build/pdf.worker.min.mjs`;
      } catch (e) { console.error(e); }
    }

    function PDFReader() {
      const [file, setFile] = useState(null);
      const [numPages, setNumPages] = useState(null);
      const [pageNumber, setPageNumber] = useState(1);
      const [scale, setScale] = useState(1.0);
      const [loading, setLoading] = useState(false);

      function onFileChange(event) {
        const selectedFile = event.target.files[0];
        if (selectedFile) {
          setLoading(true);
          setFile(selectedFile);
          setPageNumber(1);
        }
      }

      function onDocumentLoadSuccess({ numPages }) {
        setNumPages(numPages);
        setLoading(false);
        // Hide overlay if it exists
        const overlay = document.getElementById('loading-overlay');
        if (overlay) overlay.style.display = 'none';
      }

      function changePage(offset) {
        setPageNumber(prevPageNumber => prevPageNumber + offset);
      }

      function previousPage() {
        changePage(-1);
      }

      function nextPage() {
        changePage(1);
      }

      // Auto-hide debug overlay on mount
      useEffect(() => {
        const overlay = document.getElementById('loading-overlay');
        if (overlay && !loading && !file) {
          // Keep overlay until user action or show "Upload" state
          overlay.style.display = 'none';
        }
      }, []);

      return React.createElement('div', { className: "min-h-screen bg-gray-100 flex flex-col items-center p-4 pb-24" },
        // Header
        React.createElement('div', { className: "mb-6 w-full max-w-md" },
          React.createElement('h1', { className: "text-2xl font-bold text-gray-800 text-center mb-4" }, "PDF Reader"),

          // File Upload
          !file && React.createElement('div', { className: "bg-white p-6 rounded-xl shadow-lg text-center" },
            React.createElement('label', { className: "block mb-2 text-sm font-medium text-gray-900" }, "Choose a PDF file"),
            React.createElement('input', {
              type: "file",
              accept: "application/pdf",
              onChange: onFileChange,
              className: "block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
            })
          )
        ),

        // PDF View
        file && React.createElement('div', { className: "bg-white shadow-lg rounded-lg overflow-hidden w-full max-w-3xl" },
          // Doc
          React.createElement(Document, {
            file: file,
            onLoadSuccess: onDocumentLoadSuccess,
            onLoadError: (err) => window.log("Load Error: " + err.message, "error"),
            className: "flex justify-center bg-gray-50"
          },
            React.createElement(Page, {
              pageNumber: pageNumber,
              scale: scale,
              width: Math.min(window.innerWidth - 32, 600), // Responsive width
              renderAnnotationLayer: true,
              renderTextLayer: true
            })
          ),

          // Controls
          React.createElement('div', { className: "flex items-center justify-between p-4 bg-white border-t border-gray-200 sticky bottom-0 z-10" },
            React.createElement('button', {
              disabled: pageNumber <= 1,
              onClick: previousPage,
              className: "px-4 py-2 bg-gray-100 rounded-lg disabled:opacity-50 font-medium"
            }, "Preview"),

            React.createElement('span', { className: "text-gray-600 font-medium" },
              `Page ${pageNumber} of ${numPages || '--'}`
            ),

            React.createElement('button', {
              disabled: pageNumber >= numPages,
              onClick: nextPage,
              className: "px-4 py-2 bg-blue-600 text-white rounded-lg disabled:opacity-50 font-medium shadow-md"
            }, "Next")
          )
        )
      );
    }

    // Mount
    try {
      const root = createRoot(document.getElementById('root'));
      root.render(React.createElement(PDFReader));
      window.log("React App Mounted Successfully");
    } catch (err) {
      window.log("Mount Error: " + err.message, "error");
    }
  </script>
  <div id="root"></div>

  <!-- 返回首页按钮 -->
  <a href="index.html" class="home-btn" title="返回单词学习">
    <span class="home-icon">🏠</span>
  </a>

  <!-- Service Worker 注册 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>

</html>
