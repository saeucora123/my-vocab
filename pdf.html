<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>LinguistPDF - PDF阅读翻译</title>

  <!-- PWA 配置 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PDF阅读">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/brain.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007aff">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      overflow: hidden;
    }

    .react-pdf__Page {
      position: relative;
      background-color: white;
    }

    .react-pdf__Page__textContent {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .react-pdf__Page__textContent span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    ::selection {
      background: rgba(59, 130, 246, 0.3);
    }

    .react-pdf__Page__annotations {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 返回按钮样式 */
    .home-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #007aff, #005bb5);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      text-decoration: none;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .home-btn:active {
      transform: scale(0.95);
    }

    .home-icon {
      font-size: 24px;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react-pdf": "https://esm.sh/react-pdf@^10.3.0"
  }
}
</script>
  <script type="module" crossorigin src="assets/index-C39uaRO3.js"></script>
</head>

<body>

  <!-- 返回首页按钮 -->
  <a href="index.html" class="home-btn" title="返回单词学习">
    <span class="home-icon">🏠</span>
  </a>

  <!-- Service Worker 注册 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>

</html>
