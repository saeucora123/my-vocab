<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
  <title>LinguistPDF - Context Aware Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      overflow: hidden;
      /* App handles scrolling */
    }

    /* PDF Page Wrapper */
    .react-pdf__Page {
      position: relative;
      background-color: white;
      /* 允许滚动和缩放 */
      touch-action: pan-x pan-y pinch-zoom;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Text Layer - Critical for selection and Touch */
    .react-pdf__Page__textContent {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10; /* 必须高于 Canvas 才能响应触摸 */
      pointer-events: auto;
      /* 关键：允许文本选择，并移除浏览器的默认手势干扰 */
      user-select: text;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      /* 允许平移和缩放 */
      touch-action: pan-x pan-y pinch-zoom;
    }

    /* Individual Text Spans */
    .react-pdf__Page__textContent span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
      /* 确保触摸目标足够大，方便选择 */
      min-height: 1em;
    }

    /* Canvas Layer */
    .react-pdf__Page__canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      /* 允许画布响应触摸 */
      touch-action: auto;
    }

    /* Annotation Layer */
    .react-pdf__Page__annotations {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none; /* 允许点击穿透到文本层 */
    }

    /* Selection Highlight */
    ::-moz-selection {
      background: rgba(59, 130, 246, 0.3);
      /* Blue-500 with opacity */
    }
    ::selection {
      background: rgba(59, 130, 246, 0.3);
      /* Blue-500 with opacity */
    }

    /* Container for the viewer - important for mobile scrolling */
    #root {
      width: 100%;
      height: 100%;
      touch-action: manipulation; /* 优化移动端点击延迟 */
    }

    /* 修复PDF居中问题 */
    .react-pdf__Page {
      margin: 0 auto !important;
      display: flex !important;
      justify-content: center !important;
    }

    /* PDF内部层居中 */
    .react-pdf__Page__canvas,
    .react-pdf__Page__textContent,
    .react-pdf__Page__annotations {
      left: 0 !important;
      right: 0 !important;
      margin: 0 auto !important;
      position: absolute !important;
    }

    /* PDF容器确保居中对齐 */
    [class*="min-w-full"][class*="justify-center"] {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      width: 100% !important;
    }

    /* 移除可能导致偏移的样式 */
    .react-pdf__Page > div {
      margin: 0 auto !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* 移动端缩放按钮增强 */
    @media (max-width: 768px) {
      .fixed.bottom-0 button {
        min-width: 44px !important;
        min-height: 44px !important;
        touch-action: manipulation !important;
      }

      /* 底部工具栏增加点击区域 */
      .safe-area-pb {
        padding-bottom: max(1rem, env(safe-area-inset-bottom)) !important;
      }

      /* PDF区域增加触摸滚动体验 */
      .touch-pan-x.touch-pan-y {
        touch-action: pan-x pan-y pinch-zoom !important;
      }
    }

    /* 电脑端PDF容器滚动条优化 */
    @media (min-width: 769px) {
      .overflow-auto {
        scroll-behavior: smooth;
      }

      /* 确保PDF在电脑端也居中 */
      .react-pdf__Page {
        max-width: 100% !important;
        margin: 0 auto !important;
      }
    }

    /* 全局PDF容器修复 - 确保始终居中 */
    .flex-1 .overflow-auto > div {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      width: 100% !important;
    }
  </style>

<body>
  <div id="root"></div>
  <script>
    // 等待应用加载后添加增强功能
    window.addEventListener('load', function() {
      setTimeout(function() {
        // 添加鼠标滚轮缩放支持（按Ctrl键）
        document.addEventListener('wheel', function(e) {
          // 只有在PDF容器区域内且按住Ctrl键时才触发缩放
          if (e.ctrlKey || e.metaKey) {
            const pdfContainer = document.querySelector('.overflow-auto.bg-gray-200\\/50');
            if (pdfContainer && pdfContainer.contains(e.target)) {
              e.preventDefault();

              // 查找缩放按钮并点击
              const delta = e.deltaY > 0 ? -1 : 1;
              const zoomInBtn = document.querySelector('button[aria-label="Zoom in"]') ||
                               Array.from(document.querySelectorAll('button')).find(btn => btn.textContent.includes('%') && btn.nextElementSibling);
              const zoomOutBtn = document.querySelector('button[aria-label="Zoom out"]') ||
                                Array.from(document.querySelectorAll('button')).find(btn => btn.previousElementSibling && btn.previousElementSibling.textContent.includes('%'));

              // 通过查找zoom-in和zoom-out图标的按钮
              const buttons = Array.from(document.querySelectorAll('button'));
              const svgElements = document.querySelectorAll('svg');

              // 寻找缩放按钮（通过SVG图标）
              let zoomInButton = null;
              let zoomOutButton = null;

              svgElements.forEach(svg => {
                const parentBtn = svg.closest('button');
                if (parentBtn) {
                  const circles = svg.querySelectorAll('circle');
                  const lines = svg.querySelectorAll('line');
                  // zoom-in: 有圆圈和 "+" 线条
                  if (circles.length > 0 && lines.length >= 3) {
                    if (lines[0].getAttribute('x1') === lines[0].getAttribute('x2')) {
                      // 垂直线，可能是zoom-in或zoom-out
                      if (lines.length >= 3) {
                        zoomInButton = parentBtn;
                      } else {
                        zoomOutButton = parentBtn;
                      }
                    }
                  }
                }
              });

              if (delta < 0 && zoomInButton) {
                zoomInButton.click();
              } else if (delta > 0 && zoomOutButton) {
                zoomOutButton.click();
              }
            }
          }
        }, { passive: false });

        // 添加键盘快捷键支持
        document.addEventListener('keydown', function(e) {
          // Ctrl/Cmd + Plus: 放大
          if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '=')) {
            e.preventDefault();
            const zoomInBtn = Array.from(document.querySelectorAll('button')).find(btn => {
              const svg = btn.querySelector('svg');
              if (svg) {
                const lines = svg.querySelectorAll('line');
                return lines.length >= 3 && lines[0].getAttribute('x1') === lines[0].getAttribute('x2');
              }
              return false;
            });
            if (zoomInBtn) zoomInBtn.click();
          }

          // Ctrl/Cmd + Minus: 缩小
          if ((e.ctrlKey || e.metaKey) && e.key === '-') {
            e.preventDefault();
            const zoomOutBtn = Array.from(document.querySelectorAll('button')).find(btn => {
              const svg = btn.querySelector('svg');
              if (svg) {
                const lines = svg.querySelectorAll('line');
                return lines.length === 2;
              }
              return false;
            });
            if (zoomOutBtn) zoomOutBtn.click();
          }

          // Ctrl/Cmd + 0: 重置缩放
          if ((e.ctrlKey || e.metaKey) && e.key === '0') {
            e.preventDefault();
            // 重置到100% - 通过点击多次缩小按钮实现
            const zoomOutBtn = Array.from(document.querySelectorAll('button')).find(btn => {
              const svg = btn.querySelector('svg');
              if (svg) {
                const lines = svg.querySelectorAll('line');
                return lines.length === 2;
              }
              return false;
            });
            // 查找当前缩放比例
            const scaleDisplay = document.querySelector('span');
            if (scaleDisplay && scaleDisplay.textContent.includes('%')) {
              const currentScale = parseInt(scaleDisplay.textContent);
              // 如果大于100%，缩小到100%
              if (currentScale > 100 && zoomOutBtn) {
                const clicks = Math.floor((currentScale - 100) / 10);
                for (let i = 0; i < clicks; i++) {
                  setTimeout(() => zoomOutBtn.click(), i * 50);
                }
              } else if (currentScale < 100) {
                // 如果小于100%，放大到100%
                const zoomInBtn = Array.from(document.querySelectorAll('button')).find(btn => {
                  const svg = btn.querySelector('svg');
                  if (svg) {
                    const lines = svg.querySelectorAll('line');
                    return lines.length >= 3 && lines[0].getAttribute('x1') === lines[0].getAttribute('x2');
                  }
                  return false;
                });
                if (zoomInBtn) {
                  const clicks = Math.floor((100 - currentScale) / 10);
                  for (let i = 0; i < clicks; i++) {
                    setTimeout(() => zoomInBtn.click(), i * 50);
                  }
                }
              }
            }
          }
        });

        // 增强缩放按钮的点击体验 - 连续缩放
        let zoomInterval = null;
        const setupZoomHold = () => {
          const zoomButtons = document.querySelectorAll('button');
          zoomButtons.forEach(btn => {
            const svg = btn.querySelector('svg');
            if (svg) {
              const lines = svg.querySelectorAll('line');
              // 是缩放按钮
              if (lines.length >= 2) {
                btn.addEventListener('mousedown', function(e) {
                  let isZoomIn = lines.length >= 3;
                  zoomInterval = setInterval(() => {
                    btn.click();
                  }, 150);

                  const clearZoom = () => {
                    clearInterval(zoomInterval);
                    document.removeEventListener('mouseup', clearZoom);
                    document.removeEventListener('mouseleave', clearZoom);
                  };

                  document.addEventListener('mouseup', clearZoom);
                  document.addEventListener('mouseleave', clearZoom);
                });

                btn.addEventListener('mouseup', () => clearInterval(zoomInterval));
                btn.addEventListener('mouseleave', () => clearInterval(zoomInterval));
              }
            }
          });
        };

        // 移动端触摸缩放增强
        const setupTouchZoom = () => {
          let initialDistance = 0;
          let initialScale = 1;

          const pdfContainer = document.querySelector('.overflow-auto.bg-gray-200\\/50');
          if (!pdfContainer) return;

          pdfContainer.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
              initialDistance = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
              );

              // 获取当前缩放比例
              const scaleDisplay = document.querySelector('span');
              if (scaleDisplay && scaleDisplay.textContent.includes('%')) {
                initialScale = parseInt(scaleDisplay.textContent) / 100;
              }
            }
          });

          pdfContainer.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2) {
              e.preventDefault();
              const currentDistance = Math.hypot(
                e.touches[0].pageX - e.touches[1].pageX,
                e.touches[0].pageY - e.touches[1].pageY
              );

              const scale = (currentDistance / initialDistance) * initialScale;
              const clampedScale = Math.max(0.5, Math.min(3, scale));

              // 模拟点击缩放按钮
              const scaleDisplay = document.querySelector('span');
              if (scaleDisplay && scaleDisplay.textContent.includes('%')) {
                const currentScalePercent = parseInt(scaleDisplay.textContent);
                const targetScale = Math.round(clampedScale * 100);

                if (targetScale > currentScalePercent + 5) {
                  const zoomInBtn = Array.from(document.querySelectorAll('button')).find(btn => {
                    const svg = btn.querySelector('svg');
                    if (svg) {
                      const lines = svg.querySelectorAll('line');
                      return lines.length >= 3 && lines[0].getAttribute('x1') === lines[0].getAttribute('x2');
                    }
                    return false;
                  });
                  if (zoomInBtn) zoomInBtn.click();
                } else if (targetScale < currentScalePercent - 5) {
                  const zoomOutBtn = Array.from(document.querySelectorAll('button')).find(btn => {
                    const svg = btn.querySelector('svg');
                    if (svg) {
                      const lines = svg.querySelectorAll('line');
                      return lines.length === 2;
                    }
                    return false;
                  });
                  if (zoomOutBtn) zoomOutBtn.click();
                }
              }
            }
          }, { passive: false });
        };

        // 初始化增强功能
        setTimeout(() => {
          setupZoomHold();
          setupTouchZoom();
        }, 1000);
      }, 500);
    });
  </script>
