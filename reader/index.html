  <title>LinguistPDF - Context Aware Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      overflow: hidden;
      /* App handles scrolling */
    }

    /* PDF Page Wrapper */
    .react-pdf__Page {
      position: relative;
      background-color: white;
    }

    /* Text Layer - Critical for selection */
    .react-pdf__Page__textContent {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      /* Ensure text layer is above canvas */
    }

    /* Individual Text Spans */
    .react-pdf__Page__textContent span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    /* Selection Highlight */
    ::-moz-selection {
      background: rgba(59, 130, 246, 0.3);
      /* Blue-500 with opacity */
    }
    ::selection {
      background: rgba(59, 130, 246, 0.3);
      /* Blue-500 with opacity */
    }

    /* Annotation Layer */
    .react-pdf__Page__annotations {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
